<h1>臺灣生活指南</h1><p id="scope" class="notice">本指南依臺灣生活情境整理健康、安全、工作與日常生活資訊，並提供可查來源和實際做法。找不到主題時，可以換個關鍵字或從章節目錄瀏覽；目錄沒有的主題，目前尚未整理相關指引。</p>
<noscript>請啟用 JavaScript 以瀏覽完整內容。若有緊急傷病，請打 119；若正承受心理困擾，可打 1925。</noscript></header>
<main><label for="q">搜尋文章</label><br><input id="q" type="search" placeholder="例如：機車安全、求職、慢性病">
<section aria-label="依條件縮小範圍"><p>可依年齡、篩檢相關主題和家族史篩選內容。這些條件只用來找資料，不代表你符合個人資格；輸入內容只在本機用來篩選，不會傳送出去或保存在瀏覽器。</p>
<label>年齡 <input id="age" type="number" min="0" max="120" step="1" inputmode="numeric" aria-label="年齡"></label>
<label>篩檢相關主題 <select id="sex"><option value="">未填寫／全部</option><option value="f">女性</option><option value="m">男性</option></select></label>
<label>大腸癌家族史 <select id="family"><option value="">未填寫</option><option value="y">有符合的家族史</option><option value="n">沒有</option></select></label>
<button id="reset" type="button">清除條件</button></section>
<p id="status" role="status" aria-live="polite">內容載入中…</p><div id="cards"></div></main>
<footer>本頁提供一般生活資訊。補助資格、法律權益和醫療處置會因個人情況而異，辦理前請向主管機關或相關專業人員確認。原作署名與授權見 <a href="ATTRIBUTION.md">原作署名與授權</a>；發現內容或連結問題，請依<a href="https://github.com/andytwmvp/HowToLiveBetter-TW/blob/main/SUPPORT.md">問題回報方式</a>提出。</footer>
