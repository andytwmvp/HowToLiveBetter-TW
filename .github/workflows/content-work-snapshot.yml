name: 內容查核工作快照
on:
  push:
    branches: [tw/verified-content-20261015]
    paths: [.github/workflows/content-work-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 匯出固定版本來源與檢查依賴
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tw-content-work"
          git bundle create "$RUNNER_TEMP/tw-content-work/source.bundle" --all
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from urllib.request import urlopen
          out=Path(os.environ['RUNNER_TEMP'])/'tw-content-work'
          data=json.load(urlopen('https://pypi.org/pypi/OpenCC/1.1.9/json',timeout=30))
          item=next(x for x in data['urls'] if x['packagetype']=='sdist')
          raw=urlopen(item['url'],timeout=30).read()
          assert hashlib.sha256(raw).hexdigest()==item['digests']['sha256']
          (out/item['filename']).write_bytes(raw)
          (out/'dependency-sha256.json').write_text(json.dumps({item['filename']:item['digests']['sha256']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tw-content-source
          path: ${{ runner.temp }}/tw-content-work/
          retention-days: 1
      - name: 清除暫存
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/tw-content-work"
