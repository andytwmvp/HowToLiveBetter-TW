# 本次內容編修的唯讀來源快照；不部署、不發行、不修改正文。
name: 第7章編修基線快照
on:
  push:
    branches: [tw/ch07-living-support-20261016]
    paths: [.github/workflows/ch07-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 匯出固定基線與本地驗證依賴
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch07-snapshot"
          git bundle create "$RUNNER_TEMP/ch07-snapshot/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/ch07-snapshot/commit.txt"
          npm ci --prefix tools/epub
          cp tools/epub/node_modules/marked/lib/marked.esm.js "$RUNNER_TEMP/ch07-snapshot/marked.esm.js"
          cp tools/epub/node_modules/marked/package.json "$RUNNER_TEMP/ch07-snapshot/marked-package.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ch07-baseline-source
          path: ${{ runner.temp }}/ch07-snapshot/
          retention-days: 1
      - name: 清除快照暫存
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ch07-snapshot"
