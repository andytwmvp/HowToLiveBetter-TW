# 一次性內容整合；僅本fork工作分支。所有測試通過後才提交，不合併、不部署或發行。
name: 第7章生活支持正文整合驗證
on:
  push:
    branches: [tw/ch07-living-support-20261016]
    paths: [.github/workflows/ch07-integrate.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch07-living-support-20261016
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 準備固定版本工具
        run: |
          set -euo pipefail
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch07-review" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/ch07-venv"
          "$RUNNER_TEMP/ch07-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch07-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
      - name: 核對基線及明文批次後整合
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'andytwmvp/HowToLiveBetter-TW'
          test "$(git branch --show-current)" = 'tw/ch07-living-support-20261016'
          python3 tools/tw/apply_ch07.py
          git add -A
          git diff --cached --check
      - name: 全文、來源、回歸與閱讀基本功能
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 實際匯出與條目一致性
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 桌機、手機、自查及離線正文
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch07-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch07-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 全部通過後僅提交本工作分支
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          test "$(git branch --show-current)" = 'tw/ch07-living-support-20261016'
          python3 - <<'PY'
          import subprocess
          names=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          exact={'README.md','REPOSITORY_GUIDE.md','PROJECT_STATE.md','locales/zh-TW/README.md','localization/manifest.json','localization/ch07-batch.json','localization/tw-edition/runtime.json','localization/tw-edition/coverage.json','localization/tw-edition/sources/18-living-support.json','tools/tw/assets_and_browser.py','tools/tw/apply_ch07.py','.github/workflows/ch07-integrate.yml','.github/workflows/ch07-source-snapshot.yml'}
          exact.update(f'tools/tw/ch07-input-{n}.json' for n in range(4))
          for name in names:
              assert name in exact or name.startswith('locales/zh-TW/book/ch07/') or (name.startswith('localization/reviews/TW-07-') and name.endswith('.json')),name
          assert not any(name.startswith(('book/','docs/')) for name in names)
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw-content): integrate 23 reviewed living-support entries with 105-item shared reading'
          git push origin HEAD:refs/heads/tw/ch07-living-support-20261016
          echo '第7章全文與全部工程驗證通過；只提交本分支，沒有合併、部署或發行。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch07-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch07-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除本次暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch07-review" "$RUNNER_TEMP/ch07-venv" "$RUNNER_TEMP/ch07-install.log"
