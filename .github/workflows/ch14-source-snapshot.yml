name: 帳號安全內容工作快照
on:
  push:
    branches: [tw/ch14-account-security-20261015]
    paths: [.github/workflows/ch14-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 保存固定版本完整來源
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch14-source"
          git bundle create "$RUNNER_TEMP/ch14-source/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/ch14-source/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ch14-source
          path: ${{ runner.temp }}/ch14-source/
          retention-days: 1
      - name: 清理本次暫存
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ch14-source"
