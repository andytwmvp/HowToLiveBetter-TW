name: 臺灣醫療章節唯讀快照
on:
  push:
    branches: [tw/ch24-care-navigation-20261017]
    paths: [.github/workflows/ch24-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: 產生唯讀版本快照
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/medical-snapshot"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/medical-snapshot/worktree.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/medical-snapshot/head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ch24-source-snapshot
          path: ${{ runner.temp }}/medical-snapshot/
          retention-days: 1
      - name: 清理
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/medical-snapshot"
