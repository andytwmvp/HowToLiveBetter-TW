# 失效連結檢查：每週一檢查全書外部連結，結果寫入本次執行的摘要頁。
# 只報告、不因外部網站失聯而中斷；成功狀態不代表全部連結有效，請查看摘要。
# 確認失效（404、410、DOI 無此識別碼）才需要修正；境外網站拒絕連線或 TLS 不相容須另行確認。
# 不放進電子書建置流程，避免每次推送都重複檢查外部網站。
name: 失效連結檢查

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 失效連結檢查
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node tools/check-links.mjs
