# 一次性隔離套用與完整驗證；成功後僅提交本工作分支，不合併或部署。
name: 連結修正隔離驗證
on:
  push:
    branches: [tw/link-governance-20261015]
    paths: [.github/workflows/link-repair.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  repair:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 初始化暫存
        run: echo "TW_REVIEW_DIR=$RUNNER_TEMP/tw-link-review" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/link-governance-20261015
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 核對傳輸與逐檔雜湊後套用
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'andytwmvp/HowToLiveBetter-TW'
          test "$(git branch --show-current)" = 'tw/link-governance-20261015'
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          root=Path.cwd().resolve()
          corrections=[[[1295,1295,'USR'],[2460,2461,''],[4006,4008,'X']],[[1373,1373,'3'],[1508,1516,'9OJOHyORnzly/'],[1517,1527,'y'],[6200,6201,'9']],[[304,306,'m'],[307,308,''],[309,309,'6mLI'],[310,314,'']]]
          parts=[]
          for i,edits in enumerate(corrections):
              part=(root/f'tools/tw/_link-update.{i}').read_text().strip()
              for start,end,replacement in reversed(edits):part=part[:start]+replacement+part[end:]
              parts.append(part)
          payload=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          digest=lambda value:hashlib.sha256(value).hexdigest()
          assert digest(payload)=='89acbfa9538438c200cea20ba958396a9c8dc388fa766207110e5b902dd30432','傳輸與已測試版本不同'
          changes=json.loads(payload);prepared=[]
          for change in changes:
              name=change['path'];path=(root/name).resolve()
              assert path.is_relative_to(root) and not name.startswith(('.git/','.github/workflows/')) and not Path(name).is_absolute()
              old=path.read_bytes() if path.is_file() else None
              assert (digest(old) if old is not None else None)==change['before'],f'來源已有其他修改：{name}'
              lines=(old.decode('utf-8') if old is not None else '').splitlines(keepends=True)
              for start,end,replacement in reversed(change['edits']):lines[start:end]=replacement.splitlines(keepends=True)
              updated=''.join(lines).encode('utf-8') if change['after'] is not None else None
              assert (digest(updated) if updated is not None else None)==change['after'],f'目標雜湊不符：{name}'
              if name=='tools/offline/source-preview.mjs':
                  text=updated.decode('utf-8')
                  assert text.count('${SITE}selfcheck.html')==1
                  updated=text.replace('${SITE}selfcheck.html','${SITE}#reading').encode('utf-8')
                  assert digest(updated)=='77b6e7e26f7e13ca054789c4127f18d924eeb526b3cf113beb645d8e65dedb65'
              prepared.append((path,updated))
          for path,updated in prepared:
              if updated is None:path.unlink()
              else:path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(updated)
          for i in range(3):(root/f'tools/tw/_link-update.{i}').unlink()
          print(f'PASS：{len(prepared)}份修改及離線自查目的地與本地雜湊一致。')
          PY
          git add -A
      - name: 準備文字與瀏覽器工具
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tw-link-venv"
          "$RUNNER_TEMP/tw-link-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/tw-link-venv/bin" >> "$GITHUB_PATH"
      - name: 來源、文案、目的地與回歸測試
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 臺灣與原作各種匯出物連結
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          npm ci --prefix tools/epub
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
      - name: 瀏覽器、舊書籤與來源分流
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/tw-link-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/tw-link-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 全部通過後提交工作分支
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(links): route project navigation to existing fork resources and preserve provenance'
            git push origin HEAD:refs/heads/tw/link-governance-20261015
          fi
          echo '連結修改及完整測試通過，僅提交工作分支，未部署、未發行、未合併。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: link-review-${{ github.run_id }}
          path: ${{ runner.temp }}/tw-link-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清理暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/tw-link-review" "$RUNNER_TEMP/tw-link-venv" "$RUNNER_TEMP/tw-link-install.log"
