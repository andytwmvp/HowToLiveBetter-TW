name: 第19章正文核對與閱讀整合驗證
on:
  push:
    branches: [tw/ch19-labor-reviewed-20261016]
    paths: [.github/workflows/ch19-apply.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch19-labor-reviewed-20261016
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 準備固定版本依賴
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ch19-venv"
          "$RUNNER_TEMP/ch19-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch19-venv/bin" >> "$GITHUB_PATH"
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch19-review" >> "$GITHUB_ENV"
          npm ci --prefix tools/epub
      - name: 核對內容版本並整合到指定分支
        run: |
          set -euo pipefail
          test "$(git hash-object tools/tw/_ch19_content.py)" = 'ef6ef02f15a97e1a54ea68fb9b6c330684ec4a5e'
          test "$(git hash-object tools/tw/_apply_ch19.py)" = '433c4d54f3304a9d17516ad18e582f3fd9fb2b61'
          test "$(git hash-object tools/tw/tests/test_ch19_content.py)" = '643f921813669a692137765a9a31b78514ca6c34'
          python3 tools/tw/_ch19_content.py
          python3 tools/tw/_apply_ch19.py
          git add -A
      - name: 正文、來源與全部回歸
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 兩類實際匯出及內部連結
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 實際瀏覽器與正文呈現
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch19-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch19-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 全部通過後僅提交本工作分支
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'tw/ch19-labor-reviewed-20261016'
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          test -z "$(git diff --cached --name-only -- book docs LICENSE LICENSE-CODE og.png)"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw-content): integrate 13 reviewed labor-rights entries with source and runtime records'
          git push origin HEAD:refs/heads/tw/ch19-labor-reviewed-20261016
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch19-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch19-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除本次暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch19-review" "$RUNNER_TEMP/ch19-venv" "$RUNNER_TEMP/ch19-install.log"
