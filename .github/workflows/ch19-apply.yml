name: 第19章來源摘要校正與最終隔離驗證
on:
  push:
    branches: [tw/ch19-labor-reviewed-20261016]
    paths: [.github/workflows/ch19-apply.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch19-labor-reviewed-20261016
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 校正來源摘要，不改正文或已核對資料
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          test "$(git branch --show-current)" = 'tw/ch19-labor-reviewed-20261016'
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd()
          old='第11、12條保留舊年資、新制半年基數及30日給付期限。'
          new='第11、12條保留舊年資；新制每滿1年給半個月平均工資，最高6個月，終止後30日內給付。'
          batch=root/'localization/tw-edition/ch19-reviewed.json'
          review=root/'localization/reviews/TW-19-004.json'
          data=json.loads(batch.read_text(encoding='utf-8'));e=next(e for e in data['entries'] if e['id']=='TW-19-004')
          assert e['source_claims']['pension']==old
          record=json.loads(review.read_text(encoding='utf-8'));s=record['source_checks'][0]
          assert old in s['claim'] and old in s['supporting_passage']
          e['source_claims']['pension']=new
          s['claim']=s['claim'].replace(old,new);s['supporting_passage']=s['supporting_passage'].replace(old,new)
          batch.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          review.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add -- localization/tw-edition/ch19-reviewed.json localization/reviews/TW-19-004.json
      - name: 準備依賴
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ch19-venv"
          "$RUNNER_TEMP/ch19-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch19-venv/bin" >> "$GITHUB_PATH"
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch19-review" >> "$GITHUB_ENV"
          npm ci --prefix tools/epub
      - name: 來源、正文與回歸
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 兩類匯出與內部連結
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 真實瀏覽器操作
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch19-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch19-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 全部通過後只提交两份摘要校正
        run: |
          set -euo pipefail
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert paths=={'localization/tw-edition/ch19-reviewed.json','localization/reviews/TW-19-004.json'}
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(content): clarify half-month-per-year severance source summary'
          git push origin HEAD:refs/heads/tw/ch19-labor-reviewed-20261016
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch19-final-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch19-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清理暫存
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch19-review" "$RUNNER_TEMP/ch19-venv" "$RUNNER_TEMP/ch19-install.log"
