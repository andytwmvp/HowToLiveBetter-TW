name: 第16章來源與完整Git歷史唯讀快照
on:
  push:
    branches: [tw/ch16-chronic-care-20261017]
    paths: [.github/workflows/ch16-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 完整歷史與原始碼唯讀快照
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch16-snapshot"
          git bundle create "$RUNNER_TEMP/ch16-snapshot/repository.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/ch16-snapshot/source-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ch16-git-snapshot
          path: ${{ runner.temp }}/ch16-snapshot/
          retention-days: 1
      - name: 清理暫存
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ch16-snapshot"
