# 本fork一次性正文整合，先完整驗證再提交工作分支；不合併、不部署或發行。
name: 第15章住宅正文整合驗證
on:
  push:
    branches: [tw/ch15-housing-20261017]
    paths: [.github/workflows/ch15-integrate.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch15-housing-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 準備固定版本工具
        run: |
          set -euo pipefail
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch15-review" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/ch15-venv"
          "$RUNNER_TEMP/ch15-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch15-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
      - name: 核對基線與明文批次後整合
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'andytwmvp/HowToLiveBetter-TW'
          python3 tools/tw/apply_ch15.py
          git add -A
          git diff --cached --check
      - name: 正文、來源及全部回歸
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 臺灣與來源各類實際匯出
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 桌機、手機、自查及離線驗證
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch15-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch15-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 通過後只提交本工作分支
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'tw/ch15-housing-20261017'
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'README.md','REPOSITORY_GUIDE.md','PROJECT_STATE.md','locales/zh-TW/README.md','localization/manifest.json','localization/ch15-batch.json','localization/tw-edition/runtime.json','localization/tw-edition/coverage.json','localization/tw-edition/sources/19-housing.json','tools/tw/assets_and_browser.py','tools/tw/apply_ch15.py','.github/workflows/ch15-integrate.yml','.github/workflows/ch15-snapshot.yml'}
          allowed.update(f'tools/tw/ch15-input-{n}.json' for n in range(4))
          for path in paths:
              assert path in allowed or path.startswith('locales/zh-TW/book/ch15/') or (path.startswith('localization/reviews/TW-15-') and path.endswith('.json')),path
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw-content): integrate 18 housing entries with 123-item shared reading'
          git push origin HEAD:refs/heads/tw/ch15-housing-20261017
          echo '正文、來源、全部測試與瀏覽器驗證通過；僅提交工作分支。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch15-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch15-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除專用暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch15-review" "$RUNNER_TEMP/ch15-venv" "$RUNNER_TEMP/ch15-install.log"
