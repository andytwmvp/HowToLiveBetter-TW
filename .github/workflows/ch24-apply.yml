name: 第24章臺灣就醫正文與閱讀整合
on:
  push:
    branches: [tw/ch24-care-navigation-20261017]
    paths: [.github/workflows/ch24-apply.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate-and-commit:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch24-care-navigation-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 版本、變更雜湊與原始資料保護
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andytwmvp/HowToLiveBetter-TW"
          test "$(git branch --show-current)" = "tw/ch24-care-navigation-20261017"
          git merge-base --is-ancestor 97ed8f1c51006285d6cbbeae2c47240c74182812 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,subprocess
          root=Path.cwd()
          parts=[(root/f'.ci-tmp/ch24_patch{i}.b64').read_text(encoding='utf8') for i in range(5)]
          xz=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(xz).hexdigest()=='ee45f212a0e724f3b2356bf414f9c68c3865b536acc15b616bddf51b4ef4ec88'
          patch=lzma.decompress(xz)
          assert hashlib.sha256(patch).hexdigest()=='c377565713e2055f95e4ba12966c84ab6ed15972277c91586f773d0838c7ed9d'
          p=Path('/tmp/ch24-reviewed.patch')
          try:
              p.write_bytes(patch)
              subprocess.run(['git','apply','--index','--check',str(p)],check=True)
              subprocess.run(['git','apply','--index',str(p)],check=True)
          finally:
              p.unlink(missing_ok=True)
          print('PASS：44項路徑變更來源與雜湊核對一致')
          PY
          git diff --cached --check
      - name: 安裝固定版本測試工具
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ch24-venv"
          "$RUNNER_TEMP/ch24-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch24-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
      - name: 臺灣正文、官方來源、文案及回歸
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch24-evidence"
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch24-evidence" >> "$GITHUB_ENV"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$RUNNER_TEMP/ch24-evidence/coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/tw')
          from review_contract import publication_report,validate_runtime
          data=validate_runtime()
          result=publication_report()
          assert len(data['items'])==164, len(data['items'])
          assert result['publication_completed_entries']==155, result['publication_completed_entries']
          assert not result['publication_ready']
          assert all(any(x['id']==f'TW-24-{n:03d}' for x in data['items']) for n in range(1,16))
          print('PASS：155/765核心、9則導航；正式全書仍未完成')
          PY
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 線上、離線、EPUB及Anki內容一致性
        shell: bash
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$RUNNER_TEMP/ch24-evidence/exports.json"
      - name: 瀏覽器實際閱讀、搜尋、自查與來源連結
        shell: bash
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch24-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch24-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 通過後提交至本fork的工作分支
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andytwmvp/HowToLiveBetter-TW"
          test "$(git branch --show-current)" = "tw/ch24-care-navigation-20261017"
          git rm -f .github/workflows/ch24-apply.yml .ci-tmp/ch24_patch0.b64 .ci-tmp/ch24_patch1.b64 .ci-tmp/ch24_patch2.b64 .ci-tmp/ch24_patch3.b64 .ci-tmp/ch24_patch4.b64
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only','--','.github/workflows'],text=True).splitlines())
          expected={'.github/workflows/ch24-snapshot.yml','.github/workflows/ch24-apply.yml'}
          assert paths==expected, f'不允許修改其他工作流程：{sorted(paths)}'
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw-medical): verify and integrate 15 Taiwan healthcare core entries'
          git push origin HEAD:refs/heads/tw/ch24-care-navigation-20261017
          echo '第24章15條已完成工程及來源紀錄驗證，僅提交到fork工作分支；未部署或發行。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch24-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/ch24-evidence/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除測試產物與本次暫存
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch24-evidence" "$RUNNER_TEMP/ch24-venv" "$RUNNER_TEMP/ch24-install.log"
