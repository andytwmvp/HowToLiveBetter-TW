name: 第17章長者照護臺灣化驗證與受控提交
on:
  push:
    branches: [tw/ch17-elder-care-20261017]
    paths: [.github/workflows/ch17-apply.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch17-elder-care-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 驗證fork與精確套用補丁
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andytwmvp/HowToLiveBetter-TW"
          test "$(git branch --show-current)" = "tw/ch17-elder-care-20261017"
          git merge-base --is-ancestor 72ea775426cdcbc4b716ae506152607b56fc5ca7 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64,lzma,subprocess
          text=''.join(Path(f'.ci-tmp/ch17-part-{n}.b64').read_text(encoding='utf-8') for n in range(5))
          xz=base64.b64decode(text,validate=True)
          assert hashlib.sha256(xz).hexdigest()=='693fba5fa302378dde8e91cccd38f0ec42a8c612fb9f71cbdf0b85686eb52ac6'
          patch=lzma.decompress(xz)
          assert hashlib.sha256(patch).hexdigest()=='02f060ed87397b2cfabd852bafe6a048d355853fb7dbba7d695fce3d589755af'
          name=Path('/tmp/ch17-elder-care.patch')
          try:
              name.write_bytes(patch)
              subprocess.run(['git','apply','--index','--check',str(name)],check=True)
              subprocess.run(['git','apply','--index',str(name)],check=True)
          finally:
              name.unlink(missing_ok=True)
          print('PASS：37份正式修改校驗、來源SHA-256與git apply成功')
          PY
          git diff --cached --check
      - name: 安裝測試依賴
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tw-ch17-venv"
          "$RUNNER_TEMP/tw-ch17-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/tw-ch17-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
          mkdir -p "$RUNNER_TEMP/tw-ch17-evidence"
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/tw-ch17-evidence" >> "$GITHUB_ENV"
      - name: 臺灣長照、監護、法定權益、來源與單元回歸
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/tw')
          from review_contract import validate_runtime,publication_report
          data=validate_runtime(); result=publication_report()
          assert result['publication_completed_entries']==182,result['publication_completed_entries']
          assert result['publication_total_entries']==765
          assert len(data['items'])==191,len(data['items'])
          assert not result['publication_ready']
          assert all(any(e['id']==f'TW-17-{n:03d}' for e in data['items']) for n in range(1,14))
          print('PASS：182條核心、9則導航，正式全書仍未完成')
          PY
      - name: EPUB、Anki、HTML及來源稿完整匯出
        shell: bash
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/exports.json"
      - name: 桌機、手機、自查與離線瀏覽器驗證
        shell: bash
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch17-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch17-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/tw')
          from assets_and_browser import server
          from playwright.sync_api import sync_playwright
          with server() as url, sync_playwright() as p:
              browser=p.chromium.launch()
              try:
                  page=browser.new_page(viewport={'width':390,'height':844},locale='zh-TW')
                  page.goto(url,wait_until='domcontentloaded')
                  page.wait_for_function('window.TWRuntime && window.TWRuntime.ready',timeout=60000)
                  ids=set(page.locator('.q').evaluate_all('(xs)=>xs.map(x=>x.dataset.id)'))
                  expected={f'TW-17-{n:03d}' for n in range(1,14)}
                  assert ids.issuperset(expected),(len(ids),expected-ids)
                  page.locator('#q').fill('意定監護')
                  assert page.locator('#TW-17-001').count()==1
                  page.locator('#q').fill('1966')
                  assert page.locator('#TW-17-007').count()==1
                  page.goto(url+'selfcheck.html',wait_until='domcontentloaded')
                  page.wait_for_function('window.TWRuntime && window.TWRuntime.ready',timeout=60000)
                  assert page.locator('#TW-17-013').count()==1
                  page.locator('#TW-17-013 .seg button.yes').click()
                  assert page.locator('#TW-17-013 .seg button.yes').get_attribute('aria-pressed')=='true'
                  print('PASS：第17章13條手機閱讀、意定監護、1966搜尋及長者自查')
              finally: browser.close()
          PY
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 全綠燈才提交，移除所有臨時工作流程
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andytwmvp/HowToLiveBetter-TW"
          test "$(git branch --show-current)" = "tw/ch17-elder-care-20261017"
          git rm -f .github/workflows/ch17-apply.yml .github/workflows/ch17-snapshot.yml
          git rm -f .ci-tmp/ch17-part-{0,1,2,3,4}.b64
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only','--','.github/workflows'],text=True).splitlines())
          expected={'.github/workflows/ch17-apply.yml','.github/workflows/ch17-snapshot.yml'}
          assert paths==expected,f'禁止修改其他工作流程：{sorted(paths)}'
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw): review and integrate 13 elder-care core entries'
          git push origin HEAD:refs/heads/tw/ch17-elder-care-20261017
          echo '第17章13條已完成隔離驗證並提交fork工作分支，未部署或發行。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tw-ch17-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/tw-ch17-evidence/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除本次暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/tw-ch17-evidence" "$RUNNER_TEMP/tw-ch17-venv" "$RUNNER_TEMP/ch17-install.log"
