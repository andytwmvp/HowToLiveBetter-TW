# 保留原文電子書建置能力，但不得把尚未在地化的 book/ 自動發行為台灣版。
# 僅接受手動執行；沒有 tag、push、Release 或 Pages 部署步驟。
# 日常分支與 PR 檢查另由 tw-bootstrap.yml 的唯讀流程負責。
name: 原文電子書預覽（僅手動、不發行）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  checks:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        command:
          - node tools/check-refs.mjs --check
          - node tools/check-plain.mjs
          - node tools/check-split.mjs
          - node tools/sync-stats.mjs --check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: ${{ matrix.command }}

  build:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json
      - run: npm ci
        working-directory: tools/epub
      - name: EPUB
        run: node tools/epub/build.mjs --source-preview dist/HowToLiveBetter.epub
      - name: 離線單檔 HTML
        run: node tools/offline/build.mjs --source-preview dist/HowToLiveBetter.html
      - name: Anki 牌組
        run: node tools/anki/build.mjs --source-preview dist/HowToLiveBetter.apkg
      - name: 安裝原文 PDF 建置工具
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: PDF
        run: node tools/pdf/build.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: EPUB 結構驗證
        run: |
          set -euo pipefail
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/HowToLiveBetter.epub
      - name: 標示非台灣正式版
        run: |
          printf '%s\n' '此產物使用未完成台灣在地化的原文 book/，僅供工程驗證，不是台灣正式版，也不代表法規、醫療或金融內容已查核。' > dist/READ-BEFORE-USE.txt
          echo '只產生原文工程預覽；未建立 PR、未推送、未部署、未發布 Release。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SOURCE-ONLY-NOT-TAIWAN-EDITION
          retention-days: 7
          path: |
            dist/READ-BEFORE-USE.txt
            dist/HowToLiveBetter.epub
            dist/HowToLiveBetter.pdf
            dist/HowToLiveBetter.html
            dist/HowToLiveBetter.apkg
      - name: 清除工作目錄產物與工具解壓檔
        if: always()
        run: |
          rm -rf dist epubcheck.zip epubcheck-5.4.0 "pandoc-${PANDOC_VERSION}" typst-x86_64-unknown-linux-musl
