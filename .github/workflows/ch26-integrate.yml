# Temporary isolated integration: writes only to the user's fork staging branch after complete checks.
name: 第26章平台合規整合與驗證
on:
  push:
    branches: [tw/ch26-platform-compliance-20261017]
    paths: [.github/workflows/ch26-integrate.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - name: 讀取指定隔離分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch26-platform-compliance-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 固定版本驗證依賴
        run: |
          set -euo pipefail
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch26-review" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/ch26-venv"
          "$RUNNER_TEMP/ch26-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch26-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
      - name: 整合完整臺灣正文、來源及審閱紀錄
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andytwmvp/HowToLiveBetter-TW"
          test "$(git branch --show-current)" = "tw/ch26-platform-compliance-20261017"
          python3 tools/tw/apply_ch26.py
          git add -A
          git diff --cached --check
      - name: 來源保全、JSON及所有單元測試
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 臺灣及原作出版格式一致性
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 桌機、手機、自查與離線閱讀互動
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch26-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch26-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 確認僅限本章變更，全部通過後提交
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = "https://github.com/andytwmvp/HowToLiveBetter-TW"
          python3 - <<'PY'
          import subprocess
          items=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          exact={'README.md','REPOSITORY_GUIDE.md','PROJECT_STATE.md','locales/zh-TW/README.md','localization/manifest.json','localization/tw-edition/runtime.json','localization/tw-edition/coverage.json','localization/ch26-batch.json','localization/tw-edition/sources/21-platform-compliance.json','tools/tw/assets_and_browser.py','tools/tw/apply_ch26.py','.github/workflows/ch26-integrate.yml'}
          for name in items:
              assert name in exact or name.startswith('locales/zh-TW/book/ch26/') or (name.startswith('localization/reviews/TW-26-') and name.endswith('.json')),name
          assert not any(n.startswith(('book/','docs/')) for n in items)
          PY
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw): integrate 13 reviewed platform-compliance entries and 149-item reading'
            git push origin HEAD:refs/heads/tw/ch26-platform-compliance-20261017
          fi
          echo '第26章完成隔離整合；尚未合併main、部署或發布正式版。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch26-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch26-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除本批暫存和非正式產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch26-review" "$RUNNER_TEMP/ch26-venv" "$RUNNER_TEMP/ch26-install.log"
