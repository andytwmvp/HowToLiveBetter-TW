# 本批租屋購屋編修所需的唯讀基線；不修改正文、不部署、不發行。
name: 第15章編修基線
on:
  push:
    branches: [tw/ch15-housing-20261017]
    paths: [.github/workflows/ch15-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 匯出固定來源與驗證依賴
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch15-source"
          git bundle create "$RUNNER_TEMP/ch15-source/source.bundle" --all
          npm ci --prefix tools/epub
          cp tools/epub/node_modules/marked/lib/marked.esm.js "$RUNNER_TEMP/ch15-source/marked.esm.js"
          cp tools/epub/node_modules/marked/package.json "$RUNNER_TEMP/ch15-source/marked-package.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ch15-source
          path: ${{ runner.temp }}/ch15-source/
          retention-days: 1
      - name: 清理專用暫存
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ch15-source"
