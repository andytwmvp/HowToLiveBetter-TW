name: 第16章慢性病臺灣化驗證與受控提交
on:
  push:
    branches: [tw/ch16-chronic-care-20261017]
    paths: [.github/workflows/ch16-apply.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch16-chronic-care-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 檢查fork與重建精確修改包
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andytwmvp/HowToLiveBetter-TW"
          test "$(git branch --show-current)" = "tw/ch16-chronic-care-20261017"
          git merge-base --is-ancestor e13a1b7ccef36c8b1fe30ccef25e987e5f8e9f60 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64,lzma,subprocess
          source=''.join(Path(f'.ci-tmp/ch16-part-{n}.b64').read_text() for n in range(4))
          compressed=base64.b64decode(source,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='c1236a11f11d0d3f9192609f962b1a7ca1baa81bf38df1a44df61cf34f99f7df'
          patch=lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='ca44dd0cc4853d01c1902aeed3fc3cf33e918a86a87e0d18a53d62ec021dd852'
          p=Path('/tmp/htlb-ch16-git.patch')
          try:
              p.write_bytes(patch)
              subprocess.run(['git','apply','--index','--check',str(p)],check=True)
              subprocess.run(['git','apply','--index',str(p)],check=True)
          finally:
              p.unlink(missing_ok=True)
          print('PASS: 39個檔案的補丁完整性及基線通過')
          PY
          git diff --cached --check
      - name: 安裝測試與電子書建置依賴
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tw-ch16-venv"
          "$RUNNER_TEMP/tw-ch16-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/tw-ch16-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
          mkdir -p "$RUNNER_TEMP/tw-ch16-evidence"
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/tw-ch16-evidence" >> "$GITHUB_ENV"
      - name: 全部來源保全、正文、JSON、連結與單元回歸
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/tw')
          from review_contract import validate_runtime,publication_report
          data=validate_runtime()
          result=publication_report()
          assert result['publication_total_entries']==765
          assert result['publication_completed_entries']==169
          assert len(data['items'])==178
          assert not result['publication_ready']
          assert all(any(x['id']==f'TW-16-{n:03d}' for x in data['items']) for n in range(1,15))
          print('PASS：169/765核心，含9則導航178項；全書尚未完成')
          PY
      - name: HTML／EPUB／Anki與原作來源預覽
        shell: bash
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 瀏覽器實測臺灣閱讀、自查、離線與原作功能
        shell: bash
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/tw-ch16-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/tw-ch16-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 移除本批暫存流程並僅推送此工作分支
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andytwmvp/HowToLiveBetter-TW"
          test "$(git branch --show-current)" = "tw/ch16-chronic-care-20261017"
          git rm -f .github/workflows/ch16-apply.yml .github/workflows/ch16-snapshot.yml
          git rm -f .ci-tmp/ch16-part-{0,1,2,3}.b64
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only','--','.github/workflows'],text=True).splitlines())
          assert paths=={'.github/workflows/ch16-apply.yml','.github/workflows/ch16-snapshot.yml'}, sorted(paths)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw): review and integrate 14 chronic care core entries'
          git push origin HEAD:refs/heads/tw/ch16-chronic-care-20261017
          echo '第16章14條完成工程驗證並提交此fork工作分支；未部署或發行。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tw-ch16-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/tw-ch16-evidence/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除本次中間檔與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/tw-ch16-evidence" "$RUNNER_TEMP/tw-ch16-venv" "$RUNNER_TEMP/tw-ch16-install.log"
