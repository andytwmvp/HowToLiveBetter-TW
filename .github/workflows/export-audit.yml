# 本次隔離分支先核對精確修改並完整驗證，成功後才提交；不部署或發行。
name: 匯出識別與內部連結隔離驗證
on:
  push:
    branches: [fix/export-integrity-20261015]
    paths:
      - .github/workflows/export-audit.yml
      - tools/tw/_apply_export_identity.py
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  audit:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/export-integrity-20261015
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 核對精確修改與準備工具
        run: |
          set -euo pipefail
          python3 tools/tw/_apply_export_identity.py
          git add -- tools/anki/source-preview.mjs tools/epub/source-preview.mjs
          python3 -m venv "$RUNNER_TEMP/tw-export-venv"
          "$RUNNER_TEMP/tw-export-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/tw-export-venv/bin" >> "$GITHUB_PATH"
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/tw-export-review" >> "$GITHUB_ENV"
          npm ci --prefix tools/epub
      - name: 既有與新增回歸
        run: |
          set -euo pipefail
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 實際輸出與內部目的地
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 瀏覽器與工作樹唯讀性
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/tw-export-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/tw-export-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 全部通過後僅提交來源匯出模組
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/export-integrity-20261015'
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed.issubset({'tools/anki/source-preview.mjs','tools/epub/source-preview.mjs'}),changed
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(exports): isolate fork source identities and label Taiwan scope accurately'
            git push origin HEAD:refs/heads/fix/export-integrity-20261015
          fi
      - name: 保存重現用工作樹与驗證證據
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tw-export-review"
          python3 - <<'PY'
          import os,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'tw-export-review'
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'worktree.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p=root/name
                  if name and p.is_file() and p.suffix.lower() not in {'.ttf','.otf','.ttc','.woff','.woff2'}:z.write(p,name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: export-review-${{ github.run_id }}
          path: ${{ runner.temp }}/tw-export-review/
          retention-days: 1
          if-no-files-found: ignore
      - name: 清除本次暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/tw-export-review" "$RUNNER_TEMP/tw-export-venv" "$RUNNER_TEMP/tw-export-install.log"
