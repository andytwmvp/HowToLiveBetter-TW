# 本次已撰寫及核對的正文有限套用；完整測試通過後才提交工作分支。
name: 第14章來源核對與閱讀整合驗證
on:
  push:
    branches: [tw/ch14-reviewed-runtime-20261016]
    paths: [.github/workflows/ch14-apply.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch14-reviewed-runtime-20261016
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 準備固定版本工具
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ch14-venv"
          "$RUNNER_TEMP/ch14-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch14-venv/bin" >> "$GITHUB_PATH"
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch14-review" >> "$GITHUB_ENV"
          npm ci --prefix tools/epub
      - name: 核對基線與雜湊，保留已合併內容並整合正文
        run: |
          set -euo pipefail
          python3 tools/tw/_apply_ch14.py
          git add -A
      - name: 來源、正文、回歸與基本功能
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 實際匯出與條目ID一致性
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 桌機、手機、自查、正文及離線實測
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch14-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch14-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 通過後僅提交工作分支
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          test "$(git branch --show-current)" = 'tw/ch14-reviewed-runtime-20261016'
          test -z "$(git diff --cached --name-only -- .github/workflows book docs LICENSE LICENSE-CODE og.png)"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw-content): integrate 12 reviewed chapter14 entries while preserving PR6 content'
            git push origin HEAD:refs/heads/tw/ch14-reviewed-runtime-20261016
          fi
          echo '12條核心正文及9則補充導航完整驗證成功；僅提交工作分支，未合併或發行。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch14-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch14-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除本次暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch14-review" "$RUNNER_TEMP/ch14-venv" "$RUNNER_TEMP/ch14-install.log"
