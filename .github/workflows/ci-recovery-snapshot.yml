# 隔離分支先修復並完整驗證；成功後才由對話端整批更新原 PR。
name: 隔離修復與完整驗證
on:
  push:
    branches: [fix/ci-localization-recovery]
    paths:
      - tools/tw/ci_language_policy.py
      - tools/tw/tests/test_ci_policy.py
      - .github/workflows/ci-recovery-snapshot.yml
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  repair:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 初始化暫存
        run: echo "TW_REVIEW_DIR=$RUNNER_TEMP/tw-recovery-review" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/ci-localization-recovery
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 準備固定版本工具
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tw-recovery-venv"
          "$RUNNER_TEMP/tw-recovery-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/tw-recovery-venv/bin" >> "$GITHUB_PATH"
      - name: 修正文案與 JSON，保留來源與數字
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'andytwmvp/HowToLiveBetter-TW'
          test "$(git branch --show-current)" = 'fix/ci-localization-recovery'
          git merge-base --is-ancestor 7a50ee003c51467629f2362906390a4379892d8c HEAD
          python3 tools/tw/ci_language_policy.py --repair
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
          git diff --check
          git add -A
      - name: 產物與瀏覽器完整驗證
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          npm ci --prefix tools/epub
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/tw-recovery-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/tw-recovery-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 通過後只提交隔離分支
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ci): normalize draft text, repair JSON and keep asset audits read-only'
            git push origin HEAD:refs/heads/fix/ci-localization-recovery
          fi
          echo '隔離分支全部驗證通過；尚未更新 PR、合併 main 或部署。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-recovery-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/tw-recovery-review/
          retention-days: 1
          if-no-files-found: ignore
      - name: 清理暫存
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/tw-recovery-review" "$RUNNER_TEMP/tw-recovery-venv" "$RUNNER_TEMP/tw-recovery-install.log"
