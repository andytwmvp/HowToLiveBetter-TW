# 日常檢查僅讀取儲存庫；不執行遷移、不推送、不合併、不發行、不部署。
name: 繁體中文與閱讀功能檢查
on:
  push:
    branches: [main, 'tw/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tw-readonly-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 初始化暫存位置
        run: echo "TW_REVIEW_DIR=$RUNNER_TEMP/tw-review" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 安裝固定版本檢查工具
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tw-venv"
          "$RUNNER_TEMP/tw-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          "$RUNNER_TEMP/tw-venv/bin/python" -m playwright install --with-deps chromium > "$RUNNER_TEMP/tw-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/tw-install.log" 2>&1
          echo "$RUNNER_TEMP/tw-venv/bin" >> "$GITHUB_PATH"
      - name: 原始來源、授權、數字、語法與連結
        run: |
          python3 tools/tw/traditionalize.py --check
          git diff --check 1271250f082732b50b1fda851453d4b4b8f1eefd..HEAD
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
      - name: 繁體字形殘留檢查
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools/tw')
          from traditionalize import current_files,read,cc,URL,SUFFIXES
          problems=[];count=0
          canonical=lambda text:text.replace('臺','台')
          for path in current_files():
              if Path(path).suffix not in SUFFIXES or path.startswith('tools/tw/') or path.endswith('package-lock.json'):continue
              text=URL.sub('',read(path));count+=1
              if canonical(cc().convert(text))!=canonical(text):problems.append(path)
          if problems:raise SystemExit('仍有待檢查字形：'+', '.join(problems))
          print(f'PASS：{count} 份文字檔；原始網址與遷移工具的比對字串排除，台／臺均接受。此檢查不等於逐句人工精校。')
          PY
      - name: 離線閱讀、EPUB 與 Anki 工程建置
        run: |
          node tools/offline/build.mjs dist/tw-source-preview.html
          npm ci --prefix tools/epub
          node tools/epub/build.mjs
          node tools/anki/build.mjs
      - name: 圖片盤點與桌機、手機、離線互動
        run: python3 tools/tw/assets_and_browser.py --browser
      - name: 檢查範圍
        run: |
          echo '通過的是繁體字形、來源保留及閱讀功能檢查；不代表台灣制度、醫療或法律審閱完成。未部署、未發行、未合併。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zh-TW-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/tw-review/
          retention-days: 5
          if-no-files-found: ignore
      - name: 清除暫存與未發布的產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/tw-review" "$RUNNER_TEMP/tw-venv" "$RUNNER_TEMP/tw-install.log"
