name: 第19章接續編修唯讀快照
on:
  push:
    branches: [tw/ch19-completion-20261016]
    paths: [.github/workflows/ch19-completion-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 建立來源快照
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch19-completion"
          git bundle create "$RUNNER_TEMP/ch19-completion/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/ch19-completion/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ch19-completion-source
          path: ${{ runner.temp }}/ch19-completion/
          retention-days: 1
      - name: 清除專用暫存
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ch19-completion"
