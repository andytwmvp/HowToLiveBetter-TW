# 僅限本fork工作分支，完整驗證後才提交本批正文；不合併、不部署或發行。
name: 第21章旅行安全整合驗證
on:
  push:
    branches: [tw/ch21-travel-safety-20261017]
    paths: [.github/workflows/ch21-integrate.yml]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/ch21-travel-safety-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 準備固定版本依賴
        run: |
          set -euo pipefail
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch21-review" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/ch21-venv"
          "$RUNNER_TEMP/ch21-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch21-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
      - name: 基線及完整批次雜湊核對後整合
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'andytwmvp/HowToLiveBetter-TW'
          test "$(git branch --show-current)" = 'tw/ch21-travel-safety-20261017'
          python3 tools/tw/apply_ch21.py
          git add -A
          git diff --cached --check
      - name: 正文、來源及全部150項回歸
        run: |
          set -euo pipefail
          mkdir -p "$TW_REVIEW_DIR"
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/draft-coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
      - name: 實際產物與內部連結
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
      - name: 桌機、手機、自查與離線閱讀
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch21-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch21-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 全部通過後僅提交本批限定檔案
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'tw/ch21-travel-safety-20261017'
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          exact={'README.md','REPOSITORY_GUIDE.md','PROJECT_STATE.md','locales/zh-TW/README.md','localization/manifest.json','localization/ch21-batch.json','localization/tw-edition/runtime.json','localization/tw-edition/coverage.json','localization/tw-edition/sources/20-travel-safety.json','tools/tw/assets_and_browser.py','tools/tw/apply_ch21.py','.github/workflows/ch21-integrate.yml','.github/workflows/ch21-snapshot.yml'}
          exact.update(f'tools/tw/ch21-input-{i}.json' for i in range(4))
          for path in paths:
              assert path in exact or path.startswith('locales/zh-TW/book/ch21/') or (path.startswith('localization/reviews/TW-21-') and path.endswith('.json')),path
          assert not any(path.startswith(('book/','docs/')) for path in paths)
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tw-content): integrate 13 travel safety entries with 136-item shared reading'
          git push origin HEAD:refs/heads/tw/ch21-travel-safety-20261017
          echo '本批正文與完整工程驗證通過，只提交工作分支；沒有合併、部署或發行。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch21-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch21-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清除專用暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch21-review" "$RUNNER_TEMP/ch21-venv" "$RUNNER_TEMP/ch21-install.log"
