name: 第25章正文與來源整合驗證
on:
  push:
    branches: [tw/ch25-end-of-life-20261016]
    paths: [.github/workflows/ch25-integrate.yml]
permissions:
  contents: write
concurrency:
  group: ch25-scoped-integration
  cancel-in-progress: false
jobs:
  chapter:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BRANCH: tw/ch25-end-of-life-20261016
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 準備工具與隔離暫存
        run: |
          set -euo pipefail
          echo "TW_REVIEW_DIR=$RUNNER_TEMP/ch25-review" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ch25-review"
          python3 -m venv "$RUNNER_TEMP/ch25-venv"
          "$RUNNER_TEMP/ch25-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          echo "$RUNNER_TEMP/ch25-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix tools/epub
      - name: 整合固定基線正文並移除一次性工具
        run: |
          set -euo pipefail
          python3 tools/tw/apply_ch25.py
          git add -A
          python3 - <<'PY'
          import re,subprocess
          allowed={'PROJECT_STATE.md','README.md','REPOSITORY_GUIDE.md','locales/zh-TW/README.md','localization/manifest.json','localization/tw-edition/runtime.json','localization/tw-edition/coverage.json','localization/tw-edition/sources/17-after-death.json','localization/ch25-batch.json','tools/tw/assets_and_browser.py','tools/tw/check_ch25_browser.py','tools/tw/tests/test_ch25_content.py','tools/tw/apply_ch25.py','tools/tw/ch25-input-sources.json','tools/tw/ch25-input-entries.json','.github/workflows/ch25-integrate.yml'}
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z'],text=True).split('\0')
          for path in filter(None,paths):
              if path not in allowed and not re.fullmatch(r'(?:locales/zh-TW/book/ch25/(?:README|TW-25-00[1-9]|TW-25-01[0-2])\.md|localization/reviews/TW-25-(?:00[1-9]|01[0-2])\.json)',path):raise SystemExit('不在寫入範圍：'+path)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tw-content): integrate 12 chapter25 entries with scoped source reviews'
      - name: 來源、文字、回歸及交叉引用
        run: |
          set -euo pipefail
          python3 tools/tw/traditionalize.py --check
          python3 tools/tw/ci_language_policy.py --check --audit --report "$TW_REVIEW_DIR/coverage.json"
          python3 -m unittest discover -s tools/tw/tests -v
          git diff --check 1271250f082732b50b1fda851453d4b4b8f1eefd..HEAD
          node tools/check-refs.mjs --check
          node tools/check-split.mjs
          node tools/sync-stats.mjs --check
          python3 tools/tw/image_copy.py --check
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/tw')
          from review_contract import publication_report
          result=publication_report()
          assert result['publication_completed_entries']==73
          assert result['publication_total_entries']==765 and not result['publication_ready']
          print('全書仍未通過出版門檻；本批只完成第25章12條。')
          PY
      - name: 實際臺灣與原作匯出
        run: |
          set -euo pipefail
          node tools/offline/build.mjs dist/tw-source-preview.html
          node tools/offline/build.mjs
          node tools/epub/build.mjs
          node tools/anki/build.mjs
          node tools/epub/build.mjs --source-preview dist/HowToLiveBetter-source-preview.epub
          node tools/anki/build.mjs --source-preview dist/HowToLiveBetter-source-preview.apkg
          python3 tools/tw/check_link_outputs.py
          python3 tools/tw/link_policy.py --report "$TW_REVIEW_DIR/link-audit.json"
          python3 tools/tw/check_export_integrity.py dist/HowToLiveBetter-TW.html dist/tw-source-preview.html dist/HowToLiveBetter-TW.epub dist/HowToLiveBetter-source-preview.epub --report "$TW_REVIEW_DIR/export-integrity.json"
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {marked} from './tools/epub/node_modules/marked/lib/marked.esm.js';
          const html=marked.parse(readFileSync('README.md','utf8'));
          if([...html.matchAll(/<img[^>]+src="(https:\/\/img\.shields\.io\/badge\/[^"]+)"/g)].length!==6)throw Error('README徽章數量錯誤');
          JS
      - name: 桌機手機自查與離線驗證
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/ch25-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/ch25-install.log" 2>&1
          python3 tools/tw/assets_and_browser.py --browser
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: 驗證通過後僅推送本工作分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'andytwmvp/HowToLiveBetter-TW'
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
          unset auth
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ch25-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ch25-review/
          retention-days: 2
          if-no-files-found: ignore
      - name: 清理本次暫存及未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/ch25-review" "$RUNNER_TEMP/ch25-venv" "$RUNNER_TEMP/ch25-install.log"
