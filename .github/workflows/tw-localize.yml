# 一次性繁體化遷移；只寫指定工作分支，不合併、不發行、不部署、不寫上游。
name: 繁體中文遷移與圖片驗證
on:
  push:
    branches: [tw/zh-hant-ui-and-assets]
    paths: ['tools/tw/**', '.github/workflows/tw-localize.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tw-localize-${{ github.ref }}
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'andytwmvp/HowToLiveBetter-TW' && github.ref == 'refs/heads/tw/zh-hant-ui-and-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 初始化暫存位置
        run: echo "TW_REVIEW_DIR=$RUNNER_TEMP/tw-review" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: tw/zh-hant-ui-and-assets
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 安裝固定版本轉換與瀏覽器工具
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tw-venv"
          "$RUNNER_TEMP/tw-venv/bin/python" -m pip install -q 'OpenCC==1.1.9' 'playwright==1.55.0'
          "$RUNNER_TEMP/tw-venv/bin/python" -m playwright install --with-deps chromium > "$RUNNER_TEMP/tw-install.log" 2>&1
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >> "$RUNNER_TEMP/tw-install.log" 2>&1
          echo "$RUNNER_TEMP/tw-venv/bin" >> "$GITHUB_PATH"
      - name: 僅套用在授權工作分支並重製圖片
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'andytwmvp/HowToLiveBetter-TW'
          test "$GITHUB_REF" = 'refs/heads/tw/zh-hant-ui-and-assets'
          python3 tools/tw/traditionalize.py --apply
          python3 tools/tw/refine_migration.py
          python3 tools/tw/assets_and_browser.py --render
      - name: 完整驗證並保存結果
        run: |
          python3 - <<'PY'
          import os, subprocess, json
          from pathlib import Path
          out=Path(os.environ['TW_REVIEW_DIR']);out.mkdir(parents=True,exist_ok=True)
          commands=[['python3','tools/tw/traditionalize.py','--check'],['node','tools/check-refs.mjs','--check'],['node','tools/check-split.mjs'],['node','tools/sync-stats.mjs','--check'],['node','tools/offline/build.mjs','dist/tw-source-preview.html'],['npm','ci','--prefix','tools/epub'],['node','tools/epub/build.mjs'],['node','tools/anki/build.mjs'],['python3','tools/tw/assets_and_browser.py','--browser']]
          results=[]
          for args in commands:
              proc=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              print('COMMAND:', ' '.join(args), '\n',proc.stdout,flush=True)
              results.append({'command':args,'returncode':proc.returncode,'output':proc.stdout})
          (out/'validation.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          raise SystemExit(1 if any(r['returncode'] for r in results) else 0)
          PY
      - name: 通過後只提交本 fork 工作分支
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'tw/zh-hant-ui-and-assets'
          test "$(git remote get-url origin)" = 'https://github.com/andytwmvp/HowToLiveBetter-TW'
          if test -n "$(git diff --name-only -- .github/workflows)"; then
            echo '遷移不得透過執行器變更工作流程檔案'; exit 1
          fi
          python3 - <<'PY'
          import os, subprocess
          paths=subprocess.check_output(['git','ls-files','-z','--cached','--others','--exclude-standard']).split(b'\0')
          eligible=sorted({p for p in paths if p and not p.startswith((b'.github/workflows/',b'dist/',b'node_modules/')) and b'__pycache__' not in p and not p.endswith((b'.pyc',b'.ttf',b'.otf',b'.ttc',b'.woff',b'.woff2'))})
          if eligible:subprocess.run(['git','add','-A','--pathspec-from-file=-','--pathspec-file-nul'],input=b'\0'.join(eligible)+b'\0',check=True,env={**os.environ,'GIT_LITERAL_PATHSPECS':'1'})
          PY
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(zh-TW): traditionalize full corpus, interface, paths and cover assets'
            git push origin HEAD:refs/heads/tw/zh-hant-ui-and-assets
          fi
          echo '僅提交工作分支；未合併 main、未部署、未發行、未寫上游。' >> "$GITHUB_STEP_SUMMARY"
      - name: 保存檢視用原始碼與報告
        if: always()
        run: |
          mkdir -p "$TW_REVIEW_DIR"
          python3 - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['TW_REVIEW_DIR'])
          paths=subprocess.check_output(['git','ls-files','-z','--cached','--others','--exclude-standard']).decode().split('\0')
          with zipfile.ZipFile(out/'worktree.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(paths)):
                  p=root/name
                  if name and p.is_file() and not name.startswith(('dist/','node_modules/')) and '__pycache__' not in name and p.suffix.lower() not in {'.ttf','.otf','.ttc','.woff','.woff2'}:z.write(p,name)
          (out/'diff.txt').write_bytes(subprocess.check_output(['git','diff','--stat','1271250f082732b50b1fda851453d4b4b8f1eefd']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zh-TW-review-${{ github.run_id }}
          path: ${{ runner.temp }}/tw-review/
          retention-days: 5
      - name: 清除暫存與未發布產物
        if: always()
        run: rm -rf -- dist "$RUNNER_TEMP/tw-review" "$RUNNER_TEMP/tw-venv" "$RUNNER_TEMP/tw-install.log"
